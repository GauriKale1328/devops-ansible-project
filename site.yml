---
- name: Configure and deploy Bookstore application
  hosts: web
  become: true
  vars:
    app_user: bookstore
    app_dir: /opt/bookstore
    http_port: 80

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - nginx
          - python3
          - python3-flask
          - curl
        state: present
        update_cache: true

    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        shell: /usr/sbin/nologin
        system: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        mode: '0755'

    - name: Copy application code
      ansible.builtin.copy:
        src: files/app.py
        dest: "{{ app_dir }}/app.py"
        owner: "{{ app_user }}"
        mode: '0644'
      notify: Restart bookstore

    - name: Deploy systemd service
      ansible.builtin.template:
        src: templates/bookstore.service.j2
        dest: /etc/systemd/system/bookstore.service
        mode: '0644'
      notify: Restart bookstore

    - name: Configure Nginx reverse proxy
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/bookstore
        mode: '0644'
      notify: Reload nginx

    - name: Enable Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/bookstore
        dest: /etc/nginx/sites-enabled/bookstore
        state: link
      notify: Reload nginx

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Start and enable services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - bookstore
        - nginx

    - name: Flush handlers so config is applied before the check
      ansible.builtin.meta: flush_handlers

    - name: Verify application responds
      ansible.builtin.uri:
        url: "http://localhost:{{ http_port }}"
        status_code: 200
      register: health
      retries: 5
      delay: 2
      until: health.status == 200

  handlers:
    - name: Restart bookstore
      ansible.builtin.systemd:
        name: bookstore
        state: restarted
        daemon_reload: true

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
